<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Card gallery (dev)</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #0a0a0b;
        color: #ededef;
        font: 13px/1.45 system-ui, sans-serif;
      }
      header.bar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        gap: 16px;
        align-items: baseline;
        padding: 10px 20px;
        background: #0f0f11;
        border-bottom: 1px solid #232327;
      }
      header.bar strong {
        font-size: 14px;
      }
      #summary {
        color: #9a9aa3;
      }
      #summary.bad {
        color: #f87171;
      }
      main {
        padding: 20px;
      }
      h2 {
        font-size: 13px;
        font-weight: 600;
        color: #9a9aa3;
        margin: 28px 0 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        align-items: flex-start;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-top: 6px;
        font: 11px/1.3 ui-monospace, monospace;
        color: #6b6b74;
      }
      figcaption.bad {
        color: #f87171;
      }
      .cell {
        position: relative;
        overflow: hidden;
        background: repeating-conic-gradient(#1b1b1f 0% 25%, #141416 0% 50%) 0 0 / 16px 16px;
        border-radius: 6px;
      }
      .scaler {
        transform-origin: 0 0;
      }
      #single {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <strong>Card gallery</strong>
      <span id="summary">Rendering…</span>
    </header>
    <main id="main"></main>
    <script type="module" src="./gallery.ts"></script>
  </body>
</html>
